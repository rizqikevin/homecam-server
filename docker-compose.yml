services:
  backend:
    build: ./backend
    container_name: homecam-backend
    ports:
      - "8005:8000"
    privileged: true
    volumes:
      - ./recordings:/recordings
      - /dev:/dev
    restart: unless-stopped
    environment:
      - CAMERA_DEVICE=/dev/video0
      - RECORDINGS_DIR=/recordings
      - MOCK_CAMERA=false
      - TZ=Asia/Jakarta
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8000/ || wget --spider -q http://localhost:8000/ || exit 1",
        ]
      interval: 10s
      timeout: 5s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://192.168.1.10:8005
    container_name: homecam-frontend
    ports:
      - "3005:3000"
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - TZ=Asia/Jakarta
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
